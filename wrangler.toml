name = "deathandtaxes"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# The website itself. Only /api/* requests run the Worker; everything else is served straight from ./public.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Backup copy of every contact form request.
# Create it once with `npx wrangler d1 create deathandtaxes` and paste the id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "deathandtaxes"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
NOTIFY_EMAIL = "Maura@dataccounting.co"
MAIL_FROM = "DATAccounting Website <website@dataccounting.co>"
# Public Turnstile site key (spam check). Leave empty to turn the spam check off.
TURNSTILE_SITE_KEY = ""

# Secrets are never stored in this file. Set them with:
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put TURNSTILE_SECRET_KEY

[observability]
enabled = true
